name: check

# Pure checks (no publishing). Runs on every main push and pull request, and
# is also called by test-build.yml / release-build.yml through workflow_call.
# The only workflow that ever publishes is npm-publish.yml.
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run pack:fmt:check

      - name: Lint
        run: pnpm run pack:lint

      - name: Knip
        run: pnpm run pack:knip

      - name: Build
        run: pnpm run pack:build

      - name: Test
        run: pnpm run pack:test
