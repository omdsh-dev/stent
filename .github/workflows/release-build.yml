name: release-build

# Version-tag entry (or manual): verify the tag against the four package
# versions, build, pack tarballs and upload them with a SHA256 manifest.
# Publishing never happens here: npm Trusted Publishing only allows one CI
# workflow per package, so the actual publish is done solely by npm-publish.yml
# through workflow_run.
"on":
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        id: read-version
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "packing ${version}"

      - name: Verify tag and package versions
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifests=(
            package.json
            packages/stent/package.json
            packages/stent-api/package.json
            packages/stent-dsh/package.json
          )

          for manifest in "${manifests[@]}"; do
            name="$(node -p "require('./${manifest}').name")"
            package_version="$(node -p "require('./${manifest}').version")"
            if [[ "${package_version}" != "${version}" ]]; then
              echo "::error::${name}@${package_version} does not match ${RELEASE_TAG}"
              exit 1
            fi
            echo "verified ${name}@${package_version}"
          done

      - name: Build
        run: pnpm run pack:build

      - name: Pack tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stent-packages"
          for dir in packages/stent packages/stent-api packages/stent-dsh .; do
            (cd "${dir}" && pnpm pack --pack-destination "$RUNNER_TEMP/stent-packages")
          done

      - name: Write manifest
        env:
          PACK_VERSION: ${{ steps.read-version.outputs.version }}
          PACK_DIR: ${{ runner.temp }}/stent-packages
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { createHash } from "node:crypto"
            import { existsSync, readFileSync, writeFileSync } from "node:fs"
            const version = process.env.PACK_VERSION
            // Publish order: implementation packages first, root carrier last.
            const order = [
              ["@oh-my-dsh/stent", "oh-my-dsh-stent"],
              ["@oh-my-dsh/stent-api", "oh-my-dsh-stent-api"],
              ["@oh-my-dsh/stent-dsh", "oh-my-dsh-stent-dsh"],
              ["@oh-my-dsh/stent-pack", "oh-my-dsh-stent-pack"],
            ]
            const packages = []
            for (const [name, base] of order) {
              const file = `${base}-${version}.tgz`
              const path = `${process.env.PACK_DIR}/${file}`
              if (!existsSync(path)) {
                throw new Error(`missing tarball: ${path}`)
              }
              const sha256 = createHash("sha256")
                .update(readFileSync(path))
                .digest("hex")
              packages.push({ name, file, sha256 })
            }
            const manifest = { mode: "release", version, packages }
            writeFileSync(
              `${process.env.PACK_DIR}/manifest.json`,
              JSON.stringify(manifest, null, 2) + "\n"
            )
            console.log(`manifest: ${packages.length} packages @ ${version}`)
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stent-packages
          path: ${{ runner.temp }}/stent-packages
          retention-days: 14
